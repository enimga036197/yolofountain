[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-codec"
version = "0.1.0"
description = "A tiny one-way fountain codec — spray a file over any write-only channel, catch it with no back-channel."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jamie McEvoy" }]
keywords = [
    "fountain-code", "lt-code", "erasure-code", "rateless", "raptor",
    "broadcast", "multicast", "air-gap", "data-diode", "qr", "base45",
    "one-way", "no-ack", "file-transfer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
crypto = ["cryptography>=3.4"]

[project.urls]
Homepage = "https://github.com/enimga036197/beam"
Spec = "https://github.com/enimga036197/beam/blob/main/SPEC.md"

[tool.setuptools.packages.find]
include = ["beam*"]
